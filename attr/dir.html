<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dir属性示例</title>
</head>

<body>
  <!-- ltr：left to right，从左到右（默认值） -->
  <p dir="ltr">这是从左到右的中文文字。</p>

  <!-- rtl：right to left，从右到左 -->
  <p dir="rtl">这段文字会从右边开始排列。</p>

  <!-- 实际应用：阿拉伯语内容 -->
  <p dir="rtl" lang="ar">مرحبا بالعالم</p>

  <!-- auto：让浏览器根据内容自动判断方向 -->
  <p dir="auto">浏览器自动判断文字方向</p>
</body>

</html>
