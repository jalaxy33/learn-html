<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lang属性示例</title>
</head>

<body>
  <!-- 页面主体是中文 -->
  <p>今天是个好日子。</p>

  <!-- 但某段内容是英文，单独声明 -->
  <p lang="en">Today is a good day.</p>

  <!-- 某段内容是日文 -->
  <p lang="ja">今日はいい日です。</p>

  <!-- 某段内容是阿拉伯文（从右到左） -->
  <p lang="ar">اليوم يوم جيد.</p>

</body>

</html>
