<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>accesskey属性示例</title>
</head>

<body>
  <!-- 按 Alt+v（Windows）或 Ctrl+Option+v（Mac）触发搜索按钮 -->
  <button accesskey="v">搜索（快捷键 v）</button>

  <!-- 按 Alt+H 跳转到首页链接 -->
  <a href="/home" accesskey="h">首页（快捷键 H）</a>

  <!-- 按 Alt+u 聚焦到用户名输入框 -->
  <label for="username">用户名（快捷键 u）</label>
  <input type="text" id="username" accesskey="u">

</body>

</html>
