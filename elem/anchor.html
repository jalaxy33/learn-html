<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>锚点链接示例</title>
  </head>
  <body>
    <nav>
      <h2>文章目录</h2>
      <ul>
        <li><a href="#breakfast">早餐推荐</a></li>
        <li><a href="#lunch">午餐推荐</a></li>
        <li><a href="#dinner">晚餐推荐</a></li>
        <li><a href="#snack">宵夜推荐</a></li>
      </ul>
    </nav>

    <h2 id="breakfast">早餐推荐</h2>
    <p>早餐要吃好，推荐豆浆油条、包子、皮蛋瘦肉粥……（很长的内容）</p>

    <h2 id="lunch">午餐推荐</h2>
    <p>午餐要吃饱，推荐盖浇饭、面条、饺子……（很长的内容）</p>

    <h2 id="dinner">晚餐推荐</h2>
    <p>晚餐要吃少，推荐清淡的蔬菜、粥、汤……（很长的内容）</p>

    <!-- 回到顶部的链接，href="#" 表示回到页面最顶部 -->
    <!-- 也可以用 href="" 回到顶部，效果相同 -->
    <a href="#">回到顶部</a>
  </body>
</html>
