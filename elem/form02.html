<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>用户注册 - 完整示例</title>
    <style></style>
  </head>
  <body>
    <h2>新用户注册</h2>

    <form
      id="fullRegForm"
      action="/user/register"
      method="post"
      enctype="multipart/form-data"
      novalidate
    >
      <!-- 账号信息分组 -->
      <fieldset>
        <legend>账号信息</legend>

        <div>
          <label for="fUsername"></label>
          <input
            type="text"
            id="fUsername"
            name="username"
            pattern="[a-zA-Z0-9_]{4,16}"
            placeholder="4-16位字母、数字或下划线"
            required
            autofocus
          />
          <span class="error-msg" id="fUsernameErr"></span>
        </div>

        <div>
          <label for="fPassword">密码：</label>
          <input
            type="password"
            id="fPassword"
            name="password"
            minlength="6"
            maxlength="20"
            placeholder="6-20位密码"
            required
          />
          <span class="error-msg" id="fPasswordErr"></span>
        </div>

        <div>
          <label for="fEmail">邮箱：</label>
          <input type="email" id="fEmail" name="email" placeholder="example@qq.com" required />
          <span class="error-msg" id="fEmailErr"></span>
        </div>
      </fieldset>

      <!-- 个人信息分组 -->
      <fieldset>
        <legend>个人信息</legend>

        <div>
          <label for="fPhone">手机号：</label>
          <input
            type="tel"
            id="fPhone"
            name="phone"
            pattern="1[3-9][0-9]{9}"
            placeholder="请输入11位手机号"
          />
          <span class="error-msg" id="fPhoneErr"></span>
        </div>

        <div>
          <label for="fCity">所在城市：</label>
          <select id="fCity" name="city" required>
            <option value="">-- 请选择城市 --</option>
            <optgroup label="华北">
              <option value="beijing">北京</option>
              <option value="tianjin">天津</option>
            </optgroup>
            <optgroup label="华东">
              <option value="shanghai">上海</option>
              <option value="hangzhou">杭州</option>
              <option value="nanjing">南京</option>
            </optgroup>
            <optgroup label="华南">
              <option value="guangzhou">广州</option>
              <option value="shenzhen">深圳</option>
            </optgroup>
          </select>
        </div>

        <div>
          <label for="fIntro">个人简介：</label>
          <textarea
            id="fIntro"
            name="intro"
            rows="4"
            maxlength="200"
            placeholder="简单介绍一下自己（最多200字）"
            style="resize: vertical"
          ></textarea>
        </div>
      </fieldset>

      <!-- 兴趣爱好分组 -->
      <fieldset>
        <legend>兴趣爱好（可多选）</legend>

        <label>
          <input type="checkbox" name="hobby" value="reading" />
          阅读
        </label>
        <label>
          <input type="checkbox" name="hobby" value="music" />
          音乐
        </label>
        <label>
          <input type="checkbox" name="hobby" value="sports" />
          运动
        </label>
        <label>
          <input type="checkbox" name="hobby" value="travel" />
          旅行
        </label>
        <label>
          <input type="checkbox" name="hobby" value="gaming" />
          游戏
        </label>
      </fieldset>

      <!-- 性别分组 -->
      <fieldset>
        <legend>性别</legend>
        <label>
          <input type="radio" name="gender" value="male" checked />
          男
        </label>
        <label>
          <input type="radio" name="gender" value="female" />
          女
        </label>
        <label>
          <input type="radio" name="gender" value="other" />
          保密
        </label>
      </fieldset>

      <!-- 协议 -->
      <div>
        <label>
          <input type="checkbox" name="agree" value="yes" id="fAgree" required />
          我已阅读并同意《用户协议》和《隐私政策》
        </label>
        <span class="error-msg" id="fAgreeErr"></span>
      </div>

      <!-- 按钮区域 -->
      <div>
        <button type="submit">立即注册</button>
        <button type="reset">重新填写</button>
      </div>
    </form>

    <script>
      const form = document.getElementById("fullRegForm");

      // 提交时做整体验证
      form.addEventListener("submit", function (event) {
        event.preventDefault(); // 先阻止提交

        let hasError = false;

        // 验证用户名
        const username = form.elements["username"];
        const usernameErr = document.getElementById("fUsernameErr");
        if (username.validity.valueMissing) {
          usernameErr.textContent = "用户名不能为空";
          hasError = true;
        } else if (username.validity.patternMismatch) {
          usernameErr.textContent = "用户名只能包含字母、数字和下划线，长度4-16位";
          hasError = true;
        } else {
          usernameErr.textContent = "";
        }

        // 验证密码
        const password = form.elements["password"];
        const passwordErr = document.getElementById("fPasswordErr");
        if (password.validity.valueMissing) {
          passwordErr.textContent = "密码不能为空";
          hasError = true;
        } else if (password.validity.tooShort) {
          passwordErr.textContent = "密码至少6位";
          hasError = true;
        } else {
          passwordErr.textContent = "";
        }

        // 验证邮箱
        const email = form.elements["email"];
        const emailErr = document.getElementById("fEmailErr");
        if (email.validity.valueMissing) {
          emailErr.textContent = "邮箱不能为空";
          hasError = true;
        } else if (email.validity.typeMismatch) {
          emailErr.textContent = "请输入正确的邮箱格式";
          hasError = true;
        } else {
          emailErr.textContent = "";
        }

        // 验证手机号（选填，但填了就要格式正确）
        const phone = form.elements["phone"];
        const phoneErr = document.getElementById("fPhoneErr");
        if (phone.value && phone.validity.patternMismatch) {
          phoneErr.textContent = "请输入正确的11位手机号";
          hasError = true;
        } else {
          phoneErr.textContent = "";
        }

        // 验证协议复选框
        const agree = document.getElementById("fAgree");
        const agreeErr = document.getElementById("fAgreeErr");
        if (!agree.checked) {
          agreeErr.textContent = "请阅读并同意用户协议";
          hasError = true;
        } else {
          agreeErr.textContent = "";
        }

        // 没有错误才提交
        if (!hasError) {
          console.log("所有验证通过，正在提交...");
          form.submit();
        }
      });
    </script>
  </body>
</html>
