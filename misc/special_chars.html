<!doctype html>
<!-- lang 属性声明页面语言为简体中文 -->
<html lang="zh-CN">
  <head>
    <!-- charset 放在 head 最前面，声明 UTF-8 编码 -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 页面标题 -->
    <title>包含特殊字符的页面</title>
  </head>
  <body>
    <!-- 产品标题，&trade; 是商标符号 ™ -->
    <h1>超级相机&trade; 旗舰版</h1>

    <!-- 产品描述，&mdash; 是长破折号，用于补充说明 -->
    <p>这款相机&mdash;我们历时三年研发&mdash;是目前市场上最先进的消费级相机。</p>

    <!-- 价格，&yen; 是人民币符号 ¥ -->
    <p>建议零售价：&yen;3,999</p>

    <!-- 技术参数，&times; 是乘号，&plusmn; 是加减号 -->
    <h2>技术参数</h2>
    <ul>
      <!-- 传感器尺寸用乘号 -->
      <li>传感器：36mm &times; 24mm 全画幅</li>
      <!-- 误差范围用加减号 -->
      <li>快门精度：&plusmn;1/3 EV</li>
      <!-- 不等号 -->
      <li>注意：本产品与旧款配件 &ne; 兼容</li>
      <!-- 约等于号 -->
      <li>续航：约 &asymp; 500 张</li>
    </ul>

    <!-- 展示 HTML 代码时用 &lt; &gt; -->
    <h2>开发者接口说明</h2>
    <p>调用拍照接口：&lt;camera-api action="shoot"&gt;&lt;/camera-api&gt;</p>

    <!-- 营业时间用短破折号 &ndash; -->
    <h2>售后服务</h2>
    <p>客服时间：周一至周五 9:00&ndash;18:00</p>

    <!-- 导航箭头 -->
    <p>&larr; 返回列表 &nbsp;&nbsp; 立即购买 &rarr;</p>

    <!-- 版权信息，&copy; 是版权符号，&amp; 是 & 符号 -->
    <footer>
      <p>&copy; 2024 超级相机 &amp; 光学科技有限公司 版权所有</p>
    </footer>
  </body>
</html>
