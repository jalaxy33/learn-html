<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>字符实体演示页面</title>
  </head>
  <body>
    <h1>字符实体使用演示</h1>

    <!-- 1. 在文章中展示 HTML 代码 -->
    <h2>如何写一个段落标签</h2>
    <p>段落标签的完整写法是：&lt;p&gt;这里是内容&lt;/p&gt;</p>

    <!-- 2. 版权声明 -->
    <h2>版权信息</h2>
    <p>&copy; 2024 我的网站 &amp; 工作室，保留所有权利。</p>

    <!-- 3. 商品价格 -->
    <h2>商品价格</h2>
    <p>原价：&yen;199，现价：&yen;99</p>

    <!-- 4. 数学表达式 -->
    <h2>数学公式</h2>
    <p>当 a &gt; 0 且 b &gt; 0 时，a &times; b &gt; 0</p>
    <p>误差范围：&plusmn;5%</p>

    <!-- 5. 导航箭头 -->
    <h2>页面导航</h2>
    <p>&larr; 上一章 &nbsp;&nbsp;&nbsp; 下一章 &rarr;</p>

    <!-- 6. 营业时间范围 -->
    <h2>营业时间</h2>
    <p>周一至周五：9:00&ndash;18:00</p>
    <p>周末：10:00&ndash;16:00</p>

    <!-- 7. 引用说明 -->
    <h2>名言引用</h2>
    <!-- 长破折号用于句子中的补充说明 -->
    <p>学习&mdash;这件事&mdash;永远不会太晚。</p>
  </body>
</html>
